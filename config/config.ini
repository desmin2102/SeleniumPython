; Cấu hình test theo môi trường.
; Chọn env: TEST_ENV=dev (mặc định) | staging | prod
; Override field bất kỳ: TEST_BROWSER=firefox, TEST_HEADLESS=false, TEST_BASE_URL=...

[DEFAULT]
base_url = https://www.saucedemo.com
browser = chrome
headless = true
implicit_wait = 0
explicit_wait = 15

[dev]
base_url = https://www.saucedemo.com
headless = false

[staging]
base_url = https://www.saucedemo.com
headless = true

[prod]
base_url = https://www.saucedemo.com
headless = true
