# Cấu hình lint + format cho project.
# Chạy local: ruff check . && ruff format .
# Pre-commit hook tự chạy mỗi khi git commit (xem .pre-commit-config.yaml).

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["venv", ".venv", "reports", "screenshots", "logs", "allure-results"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line too long (đã có ruff format lo)
    "B904",   # raise from err - không cần thiết với BasePage helpers
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # assert False trong test cố ý

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
