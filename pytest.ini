[pytest]
markers =
    login: Login functionality tests
    inventory: Inventory page tests
    product: Product detail tests
    cart: Shopping cart tests
    checkout: Checkout flow tests
    menu: Hamburger menu tests
    footer: Footer tests
    security: URL / security tests
    e2e: End-to-end flow tests
    smoke: Smoke tests
    regression: Regression tests

addopts =
    --html=reports/report.html
    --self-contained-html
    --reruns=1
    --reruns-delay=2
    -v

testpaths = tests

# Logging - hiển thị log INFO ra console khi test fail (CLI capture)
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-7s | %(name)-25s | %(message)s
log_cli_date_format = %H:%M:%S
log_file_level = DEBUG
log_file_format = %(asctime)s | %(levelname)-7s | %(name)-25s | %(message)s
log_file_date_format = %H:%M:%S
